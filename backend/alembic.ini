# alembic.ini
# ───────────
# Alembic configuration file. This is read by the `alembic` CLI tool.
# The database URL is intentionally left as a placeholder here — it is
# overridden programmatically in alembic/env.py using our app's config.py,
# so we never have to hardcode credentials in this file.

[alembic]
# Path to the migration scripts directory, relative to this file
script_location = alembic

# Template for migration file names: timestamp_slug.py
file_template = %%(rev)s_%%(slug)s

# Timezone for timestamps in migration filenames
timezone = UTC

# Whether to truncate long revision messages in filenames
truncate_slug_length = 40

# Placeholder — overridden in env.py from app/config.py
sqlalchemy.url = postgresql://placeholder/placeholder

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
